name: 약 데이터 받아오기 (e약은요 API)

# 사용자가 GitHub UI에서 직접 실행하는 워크플로우
# Actions 탭 → "약 데이터 받아오기" → Run workflow 클릭
on:
  workflow_dispatch:
    inputs:
      category:
        description: "다운로드할 카테고리 (예: 제산제, 변비, 두드러기)"
        required: true
        default: "제산제"
        type: choice
        options:
          - 제산제
          - 변비
          - 두드러기
          - 소화제
          - 감기
          - 진통제
          - 알레르기
          - 안약
          - 무좀
          - 외상소독
          - 구충제
          - 구강
          - 설사
          - 여성건강
          - 파스
          - 연고
          - 탈모

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: API 키 환경변수 설정
        run: echo "EDRUG_API_KEY=${{ secrets.EDRUG_API_KEY }}" > .env.local

      - name: e약은요 API 다운로드 (~30,000건)
        run: node scripts/fetch-edrug.mjs

      - name: 카테고리별 source-data 추출
        run: node scripts/fetch-source.js --category "${{ inputs.category }}"

      - name: 결과 통계
        run: |
          echo "=== source-data 생성 결과 ==="
          ls -la source-data/ | head -30
          echo ""
          echo "=== 총 파일 수 ==="
          ls source-data/*.json 2>/dev/null | wc -l

      - name: source-data 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f source-data/*.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: ${{ inputs.category }} source-data 자동 다운로드"
            git push
          fi
